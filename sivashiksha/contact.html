<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbza6ZKF-y46JMhCytGOLTPfCLP6KWfLgijeywFt_z9yKrbq4v_9jLJOfSXqLwRuYMi7/exec"
const form = document.getElementById("contactForm")
const message = document.getElementById("formMessage")

form.addEventListener("submit", e => {
  e.preventDefault()

  const formData = new FormData(form)

  const data = {
    name: formData.get("name"),
    company: formData.get("company"),
    website: formData.get("website"),
    email: formData.get("email"),
    phone: formData.get("phone"),
    message: formData.get("message")
  }

  fetch(scriptURL, {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(() => {
    message.innerHTML = "Message sent successfully!"
    form.reset()
  })
  .catch(() => {
    message.innerHTML = "Error sending message"
  })
})
</script>
<script>
  function toggleMenu() {
    const navLinks = document.getElementById('navLinks');
    const hamburger = document.getElementById('hamburger');
    navLinks.classList.toggle('show');
    hamburger.classList.toggle('active');
  }

  // Handle nav link clicks for animation + navigation
  document.querySelectorAll('.nav-links a').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault(); // stop immediate navigation
      const href = link.getAttribute('href');

      // Remove active from all links
      document.querySelectorAll('.nav-links a').forEach(l => l.classList.remove('active'));

      // Add active to clicked link
      link.classList.add('active');

      // Close mobile menu if open
      const navLinks = document.getElementById('navLinks');
      const hamburger = document.getElementById('hamburger');
      navLinks.classList.remove('show');
      hamburger.classList.remove('active');

      // Optional click animation
      if (link.style.transform !== undefined) {
        link.style.transform = 'scale(0.95)';
        setTimeout(() => link.style.transform = '', 150);
      }

      // Navigate after short delay for animation
      setTimeout(() => {
        window.location.href = href;
      }, 200); // adjust delay to match animation
    });
  });

  // Scroll effects
  window.addEventListener('scroll', () => {
    const navbar = document.getElementById('navbar');
    const scrollIndicator = document.getElementById('scrollIndicator');

    if (window.scrollY > 50) {
      navbar.classList.add('scrolled');
    } else {
      navbar.classList.remove('scrolled');
    }

    const scrollPercent = (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100;
    scrollIndicator.style.width = scrollPercent + '%';
  });

  // Close mobile menu when clicking outside
  document.addEventListener('click', (e) => {
    const navLinks = document.getElementById('navLinks');
    const hamburger = document.getElementById('hamburger');
    const navbar = document.getElementById('navbar');

    if (!navbar.contains(e.target)) {
      navLinks.classList.remove('show');
      hamburger.classList.remove('active');
    }
  });
</script>
