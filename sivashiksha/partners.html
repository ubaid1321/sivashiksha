    <script>
      // Handle navigation to different pages
      function navigateToPage(page) {
        // Add click animation
        event.currentTarget.style.transform = "scale(0.95)";
        setTimeout(() => {
          event.currentTarget.style.transform = "";
        }, 150);

        // Navigate after animation
        setTimeout(() => {
          // You can replace these with actual page URLs
          const pages = {
            "web-development": "/services/web-development",
            "mobile-apps": "/services/mobile-apps",
            "ui-design": "/services/ui-design",
            "digital-marketing": "/services/digital-marketing",
            "cloud-solutions": "/services/cloud-solutions",
            consulting: "/services/consulting",
          };

          // For demo purposes, show alert. Replace with actual navigation
          alert(
            `Navigating to: ${pages[page]}\n\nReplace this alert with:\nwindow.location.href = '${pages[page]}';`
          );

          // Uncomment the line below for actual navigation:
          // window.location.href = pages[page];
        }, 200);
      }

      function toggleMenu() {
        const navLinks = document.getElementById("navLinks");
        const hamburger = document.getElementById("hamburger");

        navLinks.classList.toggle("show");
        hamburger.classList.toggle("active");
      }

      // Close mobile menu when clicking on a link
      document.querySelectorAll(".nav-links a").forEach((link) => {
        link.addEventListener("click", () => {
          const navLinks = document.getElementById("navLinks");
          const hamburger = document.getElementById("hamburger");
          navLinks.classList.remove("show");
          hamburger.classList.remove("active");
        });
      });

      // Add scroll effects
      window.addEventListener("scroll", () => {
        const navbar = document.getElementById("navbar");
        const scrollIndicator = document.getElementById("scrollIndicator");

        // Add scrolled class for navbar background
        if (window.scrollY > 50) {
          navbar.classList.add("scrolled");
        } else {
          navbar.classList.remove("scrolled");
        }

        // Update scroll indicator
        const scrollPercent =
          (window.scrollY / (document.body.scrollHeight - window.innerHeight)) *
          100;
        scrollIndicator.style.width = scrollPercent + "%";
      });

      // Close mobile menu when clicking outside
      document.addEventListener("click", (e) => {
        const navLinks = document.getElementById("navLinks");
        const hamburger = document.getElementById("hamburger");
        const navbar = document.getElementById("navbar");

        if (!navbar.contains(e.target)) {
          navLinks.classList.remove("show");
          hamburger.classList.remove("active");
        }
      });

      // Handle active link highlighting
      document.querySelectorAll(".nav-links a").forEach((link) => {
        link.addEventListener("click", () => {
          // Remove active class from all links
          document
            .querySelectorAll(".nav-links a")
            .forEach((l) => l.classList.remove("active"));

          // Add active class to clicked link
          link.classList.add("active");
          // ✅ No preventDefault, so navigation works
        });
      });
    </script>
